# grub.cfg -- config for building starlightos.iso, a real GRUB-bootable image of
# the 64-bit kernel. There is no Makefile target for this any more (the old
# `iso64` target was removed); build it by hand, from the project root:
#
#     make starlightos64.elf
#     mkdir -p isodir/boot && cp starlightos64.elf isodir/boot/
#     grub-mkrescue -o starlightos.iso isodir      # isodir/boot/grub/grub.cfg is this file
#     qemu-system-x86_64 -cdrom starlightos.iso -m 256M
#
# (Not verified by an actual boot: needs grub-mkrescue + xorriso, which the
# normal `make run` path does not use.)
#
# This is the actual fix for "the x64 stays on booting from hard
# disk": disk.img (the ext2 data disk make_disk.py builds) was
# never a bootloader -- it's just a filesystem image the kernel
# reads/writes files on at runtime. The only way this project has
# ever actually started the 64-bit kernel is `qemu-system-x86_64
# -device loader,file=starlightos64.elf`, which is a QEMU-only debugging
# shortcut that injects the ELF straight into memory and jumps to
# its entry point -- it isn't a boot process a real BIOS (or a
# BIOS-mode QEMU booting from an actual disk image) can reproduce.
# Point a real BIOS at disk.img and there is no bootloader on it at
# all for the BIOS to run.
#
# GRUB is the standard, well-trodden fix used by essentially every
# hobby multiboot kernel: `grub-mkrescue` embeds a real GRUB2 core
# image plus this config file into an El Torito-bootable ISO. That
# ISO is BIOS-bootable directly (`-cdrom starlightos.iso`), and because
# grub-mkrescue's ISOs are hybrid images (both ISO9660 and an MBR
# partition table pointing at the same El Torito boot image), the
# exact same file is *also* bootable as a raw hard disk / USB stick
# -- `qemu-system-x86_64 -hda starlightos.iso`, or `dd`'d to a real device.
# That's what actually answers "boot from hard disk": this file,
# not disk.img, needs to be what a BIOS is pointed at.
#
# menuentry's multiboot line loads starlightos64.elf itself; the copy step
# above puts it in the ISO's /boot/ directory before grub-mkrescue runs.

set timeout=3
set default=0

menuentry "StarlightOS (x86_64)" {
    multiboot /boot/starlightos64.elf
    boot
}
